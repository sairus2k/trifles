name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The pre-commit hook lints and formats only staged files; CI checks the whole tree.
      - run: npx oxlint --deny-warnings
      - run: npx oxfmt --check
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:e2e
